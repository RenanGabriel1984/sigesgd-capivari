  <!-- ══════════ STRIPES ══════════ -->
  <rect width="600" height="85" fill="#006633"/>
  <rect y="85" width="600" height="40" fill="#FFFFFF"/>
  <rect y="125" width="600" height="170" fill="#4DA6E8"/>
  <rect y="295" width="600" height="40" fill="#FFFFFF"/>
  <rect y="335" width="600" height="85" fill="#006633"/>

  <!-- ══════════ COAT OF ARMS (center) ══════════ -->
