<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <!-- Dark green stripes -->
  <rect x="0" y="0" width="300" height="40" fill="#1a5632"/>
  <rect x="0" y="160" width="300" height="40" fill="#1a5632"/>
  
  <!-- White stripes -->
  <rect x="0" y="40" width="300" height="30" fill="#FFFFFF"/>
  <rect x="0" y="130" width="300" height="30" fill="#FFFFFF"/>
  
  <!-- Sky blue center stripe -->
  <rect x="0" y="70" width="300" height="60" fill="#5b9bd5"/>
  
  <!-- Coat of arms in center (simplified) -->
  <g transform="translate(150,100) scale(0.35)">
    <!-- Shield -->
    <path d="M-50 -60 L50 -60 L50 30 C50 60 0 80 0 80 C0 80 -50 60 -50 30 Z" fill="#FFFFFF" stroke="#1a5632" stroke-width="3"/>
    <line x1="0" y1="-60" x2="0" y2="30" stroke="#1a5632" stroke-width="1.5"/>
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#1a5632" stroke-width="1.5"/>
    
    <!-- Crown -->
    <path d="M-30 -70 L-15 -90 L0 -72 L15 -90 L30 -70 Z" fill="#C8A84E" stroke="#8B6914" stroke-width="1.5"/>
    <rect x="-32" y="-72" width="64" height="8" rx="2" fill="#C8A84E" stroke="#8B6914" stroke-width="1"/>
    
    <!-- Center text -->
    <text x="0" y="0" font-family="serif" font-size="18" font-weight="bold" fill="#1a5632" text-anchor="middle">C</text>
  </g>
  
  <!-- White star at bottom -->
  <polygon points="150,185 153,178 160,178 155,173 157,166 150,170 143,166 145,173 140,178 147,178" fill="#FFFFFF"/>
</svg>
