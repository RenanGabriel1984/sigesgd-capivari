  <path d="M 404 344 L 422 358 L 404 372 Z" fill="#F7F3E8" stroke="#1F1F1F" stroke-width="1.5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#A93226" letter-spacing="1">
    <textPath href="#arcFlagMotto" startOffset="50%" text-anchor="middle">PAULISTA POR MERCÊ DE DEUS</textPath>
  </text>

  <!-- ══════════ WHITE STAR (bottom) ══════════ -->
  <polygon points="300,382 302.5,388.6 309.5,388.9 304,393.3 305.9,400.1 300,402 297.5,395.4 290.5,395.1 296,390.7 294.1,383.9" fill="#FFFFFF"/>
