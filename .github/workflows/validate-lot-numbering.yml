name: SIGESGD — validação de código (sem deploy)

on:
  push:
    branches:
      - codex/fix-global-lot-numbering
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, TypeScript e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Executar testes automatizados
        run: bunx vitest run

      - name: Verificar TypeScript e compilar frontend
        run: bun run build
