name: Convex — publicar funções em HOMOLOGAÇÃO

# ─────────────────────────────────────────────────────────────────────────────
# R32.4 — Publicação MANUAL das funções Convex no ambiente de homologação.
#
# DESTINO ÚNICO: tame-alligator-797.convex.cloud
# (projeto sigesgd-capivari-homologacao). Este arquivo NÃO publica em produção
# (first-herring-264.convex.cloud) e não deve ser adaptado para fazê-lo.
#
# Por que ele vive na `main`: o GitHub só oferece "Run workflow"
# (workflow_dispatch) para workflows presentes na branch padrão. Criar este
# arquivo na main é a ÚNICA alteração nela autorizada; nenhum código, frontend,
# OCR, autenticação ou banco é tocado por ele.
#
# Três travas, em ordem:
#   1. `workflow_dispatch` + entrada `confirmar` (padrão "nao"): sem digitar
#      exatamente `publicar-homologacao`, o job nem inicia (if de job).
#   2. Guarda da chave, ANTES do deploy: o CLI 1.48.0 escolhe o destino pela
#      própria deploy key (não aceita `--deployment` junto de
#      CONVEX_DEPLOY_KEY), então o prefixo `prod:tame-alligator-797` é
#      validado sem imprimir a chave.
#   3. Confirmação pela saída REAL do CLI: sucesso de `bunx convex deploy`
#      (exit 0, garantido pelo `pipefail`) + as linhas que a versão 1.48.0
#      imprime — "Deploying code to deployment:" e
#      "Deployed Convex functions to https://tame-alligator-797.convex.cloud".
#      Tripwire: se o host de produção aparecer no log, o job falha.
#      Nenhuma rota HTTP é chamada: `.convex.cloud` é o endpoint das funções e
#      `.convex.site` só serve as rotas registradas em src/convex/http.ts
#      (apenas auth) — não existe rota `/version` neste projeto.
#
# O QUE ESTE WORKFLOW NÃO FAZ
#   • não define variáveis de ambiente do deployment — JWT_PRIVATE_KEY, JWKS e
#     SITE_URL (exigidas por @convex-dev/auth) são configuradas no dashboard
#     do Convex, nunca aqui; CONVEX_SITE_URL é injetada pelo próprio Convex;
#   • não publica frontend (para isso: scripts/build-homolog.mjs + hosting
#     separado da produção);
#   • não usa `--yes` (opção inexistente no CLI 1.48.0) — e não precisa: com
#     deploy key o CLI compara o deployment pedido com o da chave e, sendo o
#     mesmo (`configuredDeployment.name === deploymentFields.deploymentName`),
#     não abre o prompt interativo `askToConfirmPush` de deploy.js;
#   • não chama rotas HTTP do deployment nem inventa endpoints;
#   • não roda `convex dev`, não cria/remove deployment e não escreve dados.
#
# PRÉ-REQUISITO (ação do proprietário, uma vez)
#   Secret de repositório `CONVEX_DEPLOY_KEY_HOMOLOG` = deploy key emitida
#   para o deployment de homologação (Settings → Secrets and variables →
#   Actions). Nunca a deploy key de produção.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite publicar-homologacao para publicar funções em tame-alligator-797'
        required: true
        default: nao
        type: string

permissions:
  contents: read

concurrency:
  group: convex-homologacao
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar funções no Convex de homologação
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmar == 'publicar-homologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALVO_REF: tame-alligator-797
      ALVO_HOST: tame-alligator-797.convex.cloud
      HOST_PROIBIDO: first-herring-264.convex.cloud

    steps:
      - name: Checkout (sem credenciais persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/stabilizacao-seguranca
          persist-credentials: false

      - name: Node 22 (CLI do Convex)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Bun 1.3.14 (mesma versão do ambiente local)
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Guardas de destino (nada é impresso da chave)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_HOMOLOG }}
        run: |
          # Nenhuma destas checagens imprime a chave nem parte dela.
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Este workflow só roda a partir da main (ref atual: ${GITHUB_REF})."
            exit 1
          fi

          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_HOMOLOG ausente ou vazio. Nada foi publicado."
            exit 1
          fi

          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida e poderia sobrepor a chave. Nada foi publicado."
            exit 1
          fi

          case "${CONVEX_DEPLOY_KEY}" in
            *"|"*) ;;
            *)
              echo "::error::Formato de deploy key inesperado. Nada foi publicado."
              exit 1
              ;;
          esac

          # Formato documentado: <tipo>:<deployment>|<segredo>
          prefixo="${CONVEX_DEPLOY_KEY%%|*}"
          tipo="${prefixo%%:*}"
          ref="${prefixo##*:}"

          # Somente `prod`: chave de desenvolvimento (`dev`) é recusada.
          case "${tipo}" in
            prod) ;;
            *)
              echo "::error::Tipo de deploy key não permitido (aceito apenas prod). Nada foi publicado."
              exit 1
              ;;
          esac

          if [ "${ref}" != "${ALVO_REF}" ]; then
            echo "::error::A chave NÃO pertence ao deployment de homologação esperado (${ALVO_REF}). Nada foi publicado."
            exit 1
          fi

          if [ ! -d "src/convex" ]; then
            echo "::error::convex.json aponta para src/convex/, que não existe neste commit. Nada foi publicado."
            exit 1
          fi

          echo "Alvo confirmado: ${ALVO_REF} (homologação)."
          echo "Produção (${HOST_PROIBIDO}) não é alvo deste workflow."

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Publicar funções (destino definido pela deploy key)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_HOMOLOG }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/deploy.log"
          bunx convex --version | tee "${log}"
          bunx convex deploy 2>&1 | tee -a "${log}"   # `pipefail`: exit do deploy é o exit do passo

      - name: Verificar destino publicado (log do deploy + tripwire de produção)
        run: |
          # Confirmação = (a) sucesso real de `bunx convex deploy`, cujo exit code
          # já foi propagado pelo `pipefail` do passo anterior, e (b) as duas
          # linhas que o CLI 1.48.0 emite no log:
          #   "Deploying code to deployment:"  … anúncio do alvo
          #   "Deployed Convex functions to https://<deployment>.convex.cloud"
          # Nenhuma rota HTTP é chamada aqui.
          set -euo pipefail
          log="${RUNNER_TEMP}/deploy.log"
          limpo="${RUNNER_TEMP}/deploy.limpo.log"

          if [ ! -s "${log}" ]; then
            echo "::error::Log de deploy vazio. Publicação não confirmada."
            exit 1
          fi

          # Remove só códigos ANSI do spinner; o texto das mensagens é preservado.
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "${log}" > "${limpo}"

          if grep -qF "${HOST_PROIBIDO}" "${limpo}"; then
            echo "::error::O log menciona o host de PRODUÇÃO (${HOST_PROIBIDO}). Publicação não confirmada."
            exit 1
          fi

          if ! grep -qF "Deploying code to deployment:" "${limpo}"; then
            echo "::error::O log não contém o anúncio do deployment alvo. Publicação não confirmada."
            exit 1
          fi

          if ! grep -qF "Deployed Convex functions to https://${ALVO_HOST}" "${limpo}"; then
            echo "::error::O log não contém 'Deployed Convex functions to https://${ALVO_HOST}'. Publicação não confirmada."
            exit 1
          fi

          {
            echo "### Publicação em homologação"
            echo ""
            echo "- comando: \`bunx convex deploy\` (exit 0)"
            echo "- alvo anunciado pelo CLI:"
            echo ""
            echo '```'
            grep -F -A2 "Deploying code to deployment:" "${limpo}"
            echo '```'
            echo ""
            echo "- produção (\`${HOST_PROIBIDO}\`): não referenciada no log"
            echo ""
            echo "Este workflow não altera variáveis do deployment. Se o login falhar,"
            echo "confira no dashboard de \`${ALVO_REF}\`: JWT_PRIVATE_KEY, JWKS e SITE_URL."
          } >> "${GITHUB_STEP_SUMMARY}"
