name: Validação do diagnóstico read-only de migração lote × armário

on:
  push:
    branches:
      - codex/stock-ledger-migration-readonly-audit

permissions:
  contents: read

concurrency:
  group: lot-location-readonly-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Testes e build (sem deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'
      - name: Instalar dependências com lockfile congelado
        run: bun install --frozen-lockfile
      - name: Executar suíte completa
        run: bun run test
      - name: TypeScript e build de produção
        run: bun run build
