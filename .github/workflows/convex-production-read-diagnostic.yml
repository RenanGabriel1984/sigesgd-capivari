name: Convex — diagnóstico somente leitura em first-herring-264

on:
  push:
    branches:
      - codex/production-read-diagnostic

permissions:
  contents: read

concurrency:
  group: convex-production-read-diagnostic
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar schema + internalQuery em first-herring-264
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_DEPLOYMENT: first-herring-264
      TARGET_HOST: first-herring-264.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Validar branch, schema e query; confirmar segredo e destino
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/codex/production-read-diagnostic" ]; then
            echo "::error::Branch inesperada. Nada será publicado."
            exit 1
          fi

          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida e pode desviar o alvo da deploy key. Nada foi publicado."
            exit 1
          fi

          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente. Nada foi publicado."
            exit 1
          fi

          case "${CONVEX_DEPLOY_KEY}" in
            *"|"*) ;;
            *)
              echo "::error::Formato de deploy key inesperado. Nada foi publicado."
              exit 1
              ;;
          esac

          prefixo="${CONVEX_DEPLOY_KEY%%|*}"
          tipo="${prefixo%%:*}"
          ref="${prefixo##*:}"

          if [ "${tipo}" != "dev" ] || [ "${ref}" != "${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A chave não corresponde a dev:${TARGET_DEPLOYMENT}. Nada foi publicado."
            exit 1
          fi

          if [ ! -d "src/convex" ] || ! grep -q 'lotLocationBalances: defineTable' src/convex/schema.ts; then
            echo "::error::Schema esperado não encontrado. Nada foi publicado."
            exit 1
          fi

          if ! grep -q 'export const lotLocationReadiness = internalQuery(' src/convex/stockSetup.ts; then
            echo "::error::internalQuery de diagnóstico ausente. Nada foi publicado."
            exit 1
          fi

          if grep -nE '\.(insert|patch|replace|delete)[[:space:]]*\(' <(sed -n '/export const lotLocationReadiness = internalQuery(/,/^[[:space:]]*});/p' src/convex/stockSetup.ts); then
            echo "::error::Foi encontrada operação de escrita no bloco de diagnóstico. Nada foi publicado."
            exit 1
          fi

          echo "Alvo validado: dev:${TARGET_DEPLOYMENT}."
          echo "A consulta é interna e somente leitura; este workflow não executa consultas nem migrações."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Publicar backend aditivo no deployment dev confirmado
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-dev-push.log"
          bunx convex --version
          # Para deployment do tipo dev, o comando correto é dev --once.
          # A deploy key já foi validada como dev:first-herring-264 no passo anterior.
          bunx convex dev --once 2>&1 | tee "${log}"

          # Tripwire: a saída não pode mencionar outro deployment conhecido.
          for host in savory-sockeye-292.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud tame-alligator-797.convex.cloud first-dinosaur-625.convex.cloud; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::A saída mencionou deployment não autorizado (${host})."
              exit 1
            fi
          done

          {
            echo "### Convex — publicação aditiva confirmada"
            echo ""
            echo "- deployment validado pela chave: `dev:${TARGET_DEPLOYMENT}`"
            echo "- host: `https://${TARGET_HOST}`"
            echo "- comando: `bunx convex dev --once` (concluído com exit 0)"
            echo "- conteúdo: schema aditivo + internalQuery de diagnóstico"
            echo "- migração e consulta dos dados: não executadas neste workflow"
            echo "- frontend/Freebuff: não publicados"
          } >> "${GITHUB_STEP_SUMMARY}"
