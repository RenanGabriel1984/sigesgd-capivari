name: Convex — publicar apenas o diagnóstico aditivo de estoque

on:
  push:
    branches:
      - codex/production-read-diagnostic

permissions:
  contents: read

concurrency:
  group: convex-production-read-diagnostic
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar schema + internalQuery em savory-sockeye-292
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_DEPLOYMENT: savory-sockeye-292
      TARGET_HOST: savory-sockeye-292.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Validar branch, schema e query; confirmar segredo e destino
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/codex/production-read-diagnostic" ]; then
            echo "::error::Branch inesperada. Nada será publicado."
            exit 1
          fi

          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_PROD ausente. Nada foi publicado."
            exit 1
          fi

          case "${CONVEX_DEPLOY_KEY}" in
            *"|"*) ;;
            *)
              echo "::error::Formato de deploy key inesperado. Nada foi publicado."
              exit 1
              ;;
          esac

          prefixo="${CONVEX_DEPLOY_KEY%%|*}"
          tipo="${prefixo%%:*}"
          ref="${prefixo##*:}"

          if [ "${tipo}" != "prod" ] || [ "${ref}" != "${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A chave não corresponde a prod:${TARGET_DEPLOYMENT}. Nada foi publicado."
            exit 1
          fi

          if [ ! -d "src/convex" ] || ! grep -q 'lotLocationBalances: defineTable' src/convex/schema.ts; then
            echo "::error::Schema esperado não encontrado. Nada foi publicado."
            exit 1
          fi

          if ! grep -q 'export const lotLocationReadiness = internalQuery(' src/convex/stockSetup.ts; then
            echo "::error::internalQuery de diagnóstico ausente. Nada foi publicado."
            exit 1
          fi

          if grep -nE '\.(insert|patch|replace|delete)[[:space:]]*\(' <(sed -n '/export const lotLocationReadiness = internalQuery(/,/^[[:space:]]*});/p' src/convex/stockSetup.ts); then
            echo "::error::Foi encontrada operação de escrita no bloco de diagnóstico. Nada foi publicado."
            exit 1
          fi

          echo "Alvo validado: prod:${TARGET_DEPLOYMENT}."
          echo "A consulta é interna e somente leitura; este workflow não executa consultas nem migrações."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Publicar backend aditivo no deployment confirmado
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          bunx convex --version
          bunx convex deploy 2>&1 | tee "${log}"

      - name: Confirmar host publicado e bloquear qualquer destino divergente
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"

          for host in first-herring-264.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud tame-alligator-797.convex.cloud first-dinosaur-625.convex.cloud; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::O log citou deployment não autorizado (${host})."
              exit 1
            fi
          done

          if ! grep -qF "Deploying code to deployment:" "${log}"; then
            echo "::error::O CLI não confirmou o deployment de destino."
            exit 1
          fi

          if ! grep -qF "Deployed Convex functions to https://${TARGET_HOST}" "${log}"; then
            echo "::error::O CLI não confirmou o host de produção autorizado."
            exit 1
          fi

          {
            echo "### Convex — publicação aditiva confirmada"
            echo ""
            echo "- deployment: `prod:${TARGET_DEPLOYMENT}`"
            echo "- host: `https://${TARGET_HOST}`"
            echo "- conteúdo: schema aditivo + internalQuery de diagnóstico"
            echo "- migração e consulta dos dados: não executadas neste workflow"
            echo "- frontend/Freebuff: não publicados"
          } >> "${GITHUB_STEP_SUMMARY}"
