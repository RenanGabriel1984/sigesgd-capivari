name: SIGESGD — classificação de área por item (sem publicação)

on:
  push:
    branches:
      - codex/entry-item-area-classification
  pull_request:
    branches:
      - codex/historical-stock-location-maintenance

permissions:
  contents: read

concurrency:
  group: entry-area-classification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, TypeScript e build (sem deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Executar testes Vitest
        run: bunx vitest run

      - name: Verificar ESLint
        if: always()
        run: bun run lint

      - name: Compilar frontend e TypeScript
        if: always()
        run: bun run build
