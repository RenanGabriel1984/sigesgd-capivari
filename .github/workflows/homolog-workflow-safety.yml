name: Segurança do workflow de homologação

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/convex-homologacao.yml"
      - ".github/workflows/homolog-workflow-safety.yml"
      - "src/__tests__/homolog-workflow-safety.test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convex-homologacao.yml"
      - ".github/workflows/homolog-workflow-safety.yml"
      - "src/__tests__/homolog-workflow-safety.test.ts"

permissions:
  contents: read

concurrency:
  group: homolog-workflow-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testar proteções do workflow de homologação
        run: bunx vitest run src/__tests__/homolog-workflow-safety.test.ts
