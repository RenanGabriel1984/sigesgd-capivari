name: Convex — publicar backend operacional (first-herring-264)

on:
  push:
    branches:
      - codex/stabilizacao-seguranca
    paths:
      - ".github/workflows/convex-first-herring.yml"
      - "src/convex/stockSetup.ts"
      - "src/convex/stockSetupDiagnostics.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-first-herring-operacional
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar somente funções Convex em first-herring-264
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALVO_REF: first-herring-264
      ALVO_HOST: first-herring-264.convex.cloud
      HOSTS_PROIBIDOS: "savory-sockeye-292.convex.cloud tame-alligator-797.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud first-dinosaur-625.convex.cloud"

    steps:
      - name: Checkout da branch operacional
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/stabilizacao-seguranca
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar destino da deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente. Nada foi publicado."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida e poderia sobrepor a chave. Nada foi publicado."
            exit 1
          fi
          case "${CONVEX_DEPLOY_KEY}" in
            dev:first-herring-264\|*) ;;
            *)
              echo "::error::A chave não pertence ao deployment dev:first-herring-264. Nada foi publicado."
              exit 1
              ;;
          esac
          if [ ! -d "src/convex" ]; then
            echo "::error::Diretório src/convex ausente. Nada foi publicado."
            exit 1
          fi
          echo "Destino validado: dev:first-herring-264."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Publicar somente funções/backend Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          bunx convex --version | tee "${log}"
          bunx convex deploy 2>&1 | tee -a "${log}"

      - name: Confirmar deployment e bloquear destinos indevidos
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          for host in ${HOSTS_PROIBIDOS}; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::O log citou deployment protegido (${host})."
              exit 1
            fi
          done
          if ! grep -qF "Deploying code to deployment:" "${log}"; then
            echo "::error::O CLI não confirmou o deployment alvo."
            exit 1
          fi
          if ! grep -qF "Deployed Convex functions to https://${ALVO_HOST}" "${log}"; then
            echo "::error::O CLI não confirmou publicação em ${ALVO_HOST}."
            exit 1
          fi
          echo "Backend publicado e confirmado exclusivamente em ${ALVO_REF}." >> "${GITHUB_STEP_SUMMARY}"
