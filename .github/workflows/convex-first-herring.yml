name: Convex — publicar backend operacional (first-herring-264)

on:
  push:
    branches:
      - codex/stabilizacao-seguranca
    paths:
      - ".github/workflows/convex-first-herring.yml"
      - "src/convex/stockSetup.ts"
      - "ops/one-time/execute-ti-geral-classification-20261116.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-first-herring-operacional
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar somente funções Convex em first-herring-264
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALVO_REF: first-herring-264
      ALVO_HOST: first-herring-264.convex.cloud
      HOSTS_PROIBIDOS: "savory-sockeye-292.convex.cloud tame-alligator-797.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud first-dinosaur-625.convex.cloud"

    steps:
      - name: Checkout da branch operacional
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/stabilizacao-seguranca
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar destino da deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente. Nada foi publicado."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida e poderia sobrepor a chave. Nada foi publicado."
            exit 1
          fi
          case "${CONVEX_DEPLOY_KEY}" in
            dev:first-herring-264\|*) ;;
            *)
              echo "::error::A chave não pertence ao deployment dev:first-herring-264. Nada foi publicado."
              exit 1
              ;;
          esac
          if [ ! -d "src/convex" ]; then
            echo "::error::Diretório src/convex ausente. Nada foi publicado."
            exit 1
          fi
          echo "Destino validado: dev:first-herring-264."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Publicar somente funções/backend Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          bunx convex --version | tee "${log}"
          bunx convex deploy 2>&1 | tee -a "${log}"

      - name: Confirmar deployment e bloquear destinos indevidos
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          for host in ${HOSTS_PROIBIDOS}; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::O log citou deployment protegido (${host})."
              exit 1
            fi
          done
          if ! grep -qF "Deploying code to deployment:" "${log}"; then
            echo "::error::O CLI não confirmou o deployment alvo."
            exit 1
          fi
          if ! grep -qF "Deployed Convex functions to https://${ALVO_HOST}" "${log}"; then
            echo "::error::O CLI não confirmou publicação em ${ALVO_HOST}."
            exit 1
          fi
          echo "Backend publicado e confirmado exclusivamente em ${ALVO_REF}." >> "${GITHUB_STEP_SUMMARY}"
      - name: Executar classificação TI Geral autorizada (operação única)
        if: "github.event.head_commit.message == 'ops: execute one-time TI Geral classification in first-herring-264'"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          case "${CONVEX_DEPLOY_KEY:-}" in
            dev:first-herring-264\|*) ;;
            *)
              echo "::error::A chave não pertence a dev:first-herring-264. Nenhuma classificação executada."
              exit 1
              ;;
          esac
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT poderia sobrepor o destino."
            exit 1
          fi

          set +e
          result="$(bunx convex run stockSetup:applyLegacyGeneralAreaClassification '{"confirmation":"CONFIRMAR_CLASSIFICACAO_36_SALDOS_TI_GERAL_FIRST_HERRING"}' 2>&1)"
          run_status=$?
          set -e
          printf '%s\n' "$result"
          if [ "$run_status" -ne 0 ]; then
            echo "::error::O CLI do Convex falhou ao chamar a mutation (código $run_status)."
            exit "$run_status"
          fi
          if ! grep -Eq '"applied"[[:space:]]*:[[:space:]]*true|"idempotentNoOp"[[:space:]]*:[[:space:]]*true' <<< "$result"; then
            echo "::error::A função não confirmou aplicação ou no-op idempotente."
            exit 1
          fi
          if ! grep -Eq '"totalQuantityClassified"[[:space:]]*:[[:space:]]*1919' <<< "$result"; then
            echo "::error::O retorno não confirmou as 1.919 unidades previstas."
            exit 1
          fi
          if ! grep -Eq '"updatedRows"[[:space:]]*:[[:space:]]*36|"updatedLots"[[:space:]]*:[[:space:]]*36' <<< "$result" && ! grep -q '"idempotentNoOp"[[:space:]]*:[[:space:]]*true' <<< "$result"; then
            echo "::error::A função não confirmou os 36 registros previstos."
            exit 1
          fi

          audit="$(bunx convex run stockSetup:lotLocationBalanceIntegrity '{}')"
          printf '%s\n' "$audit"
          if ! grep -Eq '"areaClassificationBlocked"[[:space:]]*:[[:space:]]*0' <<< "$audit"; then
            echo "::error::A auditoria não confirmou zero registros bloqueados em classificação de área."
            exit 1
          fi
          if ! grep -Eq '"lotsMissingLocationMetadata"[[:space:]]*:[[:space:]]*61' <<< "$audit"; then
            echo "::error::A contagem dos 61 lotes sem metadata de localização mudou; revisar antes de qualquer outra ação."
            exit 1
          fi
          echo "Classificação TI Geral: 36 registros / 1.919 unidades. Auditoria pós-operação concluída." >> "${GITHUB_STEP_SUMMARY}"

