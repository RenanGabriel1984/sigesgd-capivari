name: Integridade das credenciais

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/convex/passwords.ts"
      - "src/convex/users.ts"
      - "src/pages/Auth.tsx"
      - "src/pages/Users.tsx"
      - "src/lib/credential-integrity.ts"
      - "src/__tests__/credential-integrity.test.ts"
      - ".github/workflows/credential-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "src/convex/passwords.ts"
      - "src/convex/users.ts"
      - "src/pages/Auth.tsx"
      - "src/pages/Users.tsx"
      - "src/lib/credential-integrity.ts"
      - "src/__tests__/credential-integrity.test.ts"
      - ".github/workflows/credential-integrity.yml"

permissions:
  contents: read

concurrency:
  group: credential-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testar integridade das credenciais
        run: bunx vitest run src/__tests__/credential-integrity.test.ts
