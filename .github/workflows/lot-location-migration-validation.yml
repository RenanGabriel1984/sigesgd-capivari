name: Validar preparação da migração lote × armário

on:
  push:
    branches:
      - codex/lot-location-migration-preparation

permissions:
  contents: read

concurrency:
  group: lot-location-migration-preparation-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Testar migração lote × armário
        run: bunx vitest run src/__tests__/lot-location-migration.test.ts

      - name: Executar suíte completa
        run: bunx vitest run

      - name: Compilar TypeScript e frontend
        run: bun run build
