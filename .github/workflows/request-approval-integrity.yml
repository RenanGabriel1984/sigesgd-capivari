name: Integridade de aprovação de solicitações

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/convex/requests.ts"
      - "src/lib/request-approval-validation.ts"
      - "src/__tests__/request-approval-validation.test.ts"
      - ".github/workflows/request-approval-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "src/convex/requests.ts"
      - "src/lib/request-approval-validation.ts"
      - "src/__tests__/request-approval-validation.test.ts"
      - ".github/workflows/request-approval-integrity.yml"

permissions:
  contents: read

concurrency:
  group: request-approval-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testar integridade da aprovação
        run: bunx vitest run src/__tests__/request-approval-validation.test.ts
