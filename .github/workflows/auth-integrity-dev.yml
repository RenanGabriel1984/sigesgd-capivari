name: Authentication credential integrity DEV validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: auth-integrity-first-herring
  cancel-in-progress: false
jobs:
  validation:
    if: github.head_ref == 'codex/authentication-dev-integrity-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Tests, TypeScript and production build
        run: bun run test && bun run build
      - name: Guard DEV only
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          test -n "${CONVEX_DEPLOY_KEY:-}"
          test "${CONVEX_DEPLOY_KEY%%|*}" = "dev:first-herring-264"
          test -z "${CONVEX_DEPLOYMENT:-}"
      - name: Deploy DEV functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: bunx convex dev --once --tail-logs disable
      - name: Execute credential integrity scenarios and clean fixture
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/convex-dev-auth-integrity-validation.mjs
