name: Validação transacional — Água mineral (Convex DEV)
on:
  push:
    branches: [codex/water-mineral-integrated]
  pull_request:
    branches: [codex/stock-dimension-report-integrity]
permissions:
  contents: read
concurrency:
  group: water-dev-first-herring
  cancel-in-progress: false
jobs:
  water-dev:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/water-mineral-integrated'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_DEPLOYMENT: first-herring-264
      TARGET_HOST: first-herring-264.convex.cloud
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with: { bun-version: "1.3.14" }
      - run: bun install --frozen-lockfile
      - name: Testes, TypeScript e build
        run: |
          set -euo pipefail
          bun run test
          bun run build
      - name: Confirmar chave DEV exclusiva
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          test -n "${CONVEX_DEPLOY_KEY:-}"
          test "${CONVEX_DEPLOY_KEY%%|*}" = "dev:first-herring-264"
          test -z "${CONVEX_DEPLOYMENT:-}"
      - name: Publicar funções exclusivamente no DEV
        id: deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          bunx convex dev --once --tail-logs disable
      - name: Executar cenários transacionais e limpeza
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: node scripts/convex-dev-water-validation.mjs
