name: Inclusão controlada das três áreas operacionais — first-herring-264

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-operational-stock-areas-first-herring
  cancel-in-progress: false

jobs:
  create-areas:
    name: Criar somente as três áreas autorizadas e verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DEPLOYMENT: first-herring-264
      TARGET_HOST: first-herring-264.convex.cloud
      CONVEX_MAINTENANCE_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
      FORBIDDEN_HOSTS: "savory-sockeye-292.convex.cloud tame-alligator-797.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud first-dinosaur-625.convex.cloud"
    steps:
      - name: Checkout branch autorizada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/historical-stock-location-maintenance
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar chave e deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_MAINTENANCE_KEY:-}" ]; then
            echo "::error::Secret CONVEX_MAINTENANCE_KEY_FIRST_HERRING ausente. Nenhuma alteração feita."
            exit 1
          fi
          key="$(printf '%s' "${CONVEX_MAINTENANCE_KEY}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          prefix="${key%%|*}"
          token="${key#*|}"
          if [ "${prefix}" != "dev:${TARGET_DEPLOYMENT}" ] || [[ "${token}" != eyJ* || "${token}" == *'|'* || "${token}" =~ [[:space:]] ]]; then
            echo "::error::A chave não corresponde a dev:first-herring-264. Operação cancelada."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT inesperada. Operação cancelada."
            exit 1
          fi
          printf 'CONVEX_DEPLOY_KEY=%s\n' "${key}" >> "${GITHUB_ENV}"
          echo "Destino validado: dev:first-herring-264."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Publicar a mutation interna no deployment autorizado
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-deploy.log"
          bunx convex deploy 2>&1 | tee "${log}"
          for host in ${FORBIDDEN_HOSTS}; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::Destino protegido detectado no log: ${host}"
              exit 1
            fi
          done
          grep -qF "Deployed Convex functions to https://${TARGET_HOST}" "${log}" || {
            echo "::error::Publicação não confirmou first-herring-264. Mutation não será chamada."
            exit 1
          }

      - name: Confirmar que a mutation foi publicada
        shell: bash
        run: |
          set -euo pipefail
          spec="${RUNNER_TEMP}/function-spec.json"
          bunx convex function-spec > "${spec}"
          grep -qF "stockAreaMaintenance.js:ensureOfficialOperationalAreasInternal" "${spec}" || {
            echo "::error::Mutation ausente no deployment. Nenhuma área foi criada."
            exit 1
          }

      - name: Pré-verificação read-only do estado atual
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/preflight.inline.ts" <<'EOF'
          const areas = await ctx.db.query("stockAreas").collect();
          const names = areas.map(area => area.name).sort();
          const expected = ["Impressoras", "TI Geral"].sort();
          if (areas.length !== 2 || names.some((name, i) => name !== expected[i])) {
            throw new Error("Pré-condição divergente: esperado somente TI Geral e Impressoras. Nenhuma criação autorizada.");
          }
          return { readOnly: true, areaCount: areas.length, names };
          EOF
          bunx convex run --inline-query "$(cat "${RUNNER_TEMP}/preflight.inline.ts")" > "${RUNNER_TEMP}/preflight.json"
          cat "${RUNNER_TEMP}/preflight.json"

      - name: Criar exatamente as três áreas autorizadas
        shell: bash
        run: |
          set -euo pipefail
          args='{"confirmation":"CRIAR-3-AREAS-OPERACIONAIS-FIRST-HERRING"}'
          bunx convex run stockAreaMaintenance:ensureOfficialOperationalAreasInternal "${args}" > "${RUNNER_TEMP}/creation-result.json"
          cat "${RUNNER_TEMP}/creation-result.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const raw = readFileSync(process.env.RUNNER_TEMP + "/creation-result.json", "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("Resposta da criação não contém JSON.");
          const result = JSON.parse(raw.slice(start, end + 1));
          const expected = ["Limpeza", "Copa e Cozinha", "Água Mineral"];
          if (result.applied !== true || result.createdCount !== 3 ||
              result.auditLogsCreated !== 3 || result.created.map(x => x.name).sort().join("|") !== expected.sort().join("|") ||
              result.existingAreasChanged !== 0 || result.productsChanged !== 0 ||
              result.lotsChanged !== 0 || result.balancesChanged !== 0 ||
              result.locationsChanged !== 0 || result.movementsChanged !== 0) {
            throw new Error("Resultado fora do escopo autorizado. Verificação bloqueada.");
          }
          NODE

      - name: Verificação independente read-only após a criação
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/verify.inline.ts" <<'EOF'
          const areas = await ctx.db.query("stockAreas").collect();
          const expected = ["Água Mineral", "Copa e Cozinha", "Impressoras", "Limpeza", "TI Geral"];
          const names = areas.map(area => area.name).sort((a, b) => a.localeCompare(b, "pt-BR"));
          if (areas.length !== 5 || expected.some(name => !names.includes(name))) {
            throw new Error("A estrutura final não contém exatamente as cinco áreas oficiais.");
          }
          const createdNames = ["Limpeza", "Copa e Cozinha", "Água Mineral"];
          const logs = await ctx.db.query("auditLogs").collect();
          const creationLogs = logs.filter(log => {
            if (log.entity !== "stockAreas") return false;
            try {
              const details = JSON.parse(log.details ?? "{}");
              return details.operation === "authorized_operational_area_creation" &&
                createdNames.includes(details.areaName);
            } catch { return false; }
          });
          if (creationLogs.length !== 3) throw new Error("Os três logs individuais de auditoria não foram encontrados.");
          return {
            readOnly: true,
            verified: true,
            totalAreas: areas.length,
            areas: areas.map(area => ({ name: area.name, active: area.active })).sort((a, b) => a.name.localeCompare(b.name, "pt-BR")),
            creationAuditLogs: creationLogs.length,
          };
          EOF
          bunx convex run --inline-query "$(cat "${RUNNER_TEMP}/verify.inline.ts")" > "${RUNNER_TEMP}/verification.json"
          cat "${RUNNER_TEMP}/verification.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const raw = readFileSync(process.env.RUNNER_TEMP + "/verification.json", "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("Resposta da verificação não contém JSON.");
          const report = JSON.parse(raw.slice(start, end + 1));
          if (report.readOnly !== true || report.verified !== true ||
              report.totalAreas !== 5 || report.creationAuditLogs !== 3) {
            throw new Error("Verificação final reprovada.");
          }
          NODE
          {
            echo "### Inclusão das áreas operacionais verificada"
            echo ""
            echo '- Deployment: `dev:first-herring-264`'
            echo "- Áreas criadas: **Limpeza, Copa e Cozinha e Água Mineral**"
            echo "- Total final: **5 áreas oficiais**"
            echo "- Logs individuais de auditoria: **3**"
            echo "- Produtos, lotes, saldos, locais e movimentos alterados: **nenhum**"
            echo '- Produção oficial `savory-sockeye-292`: **não utilizada**'
          } >> "${GITHUB_STEP_SUMMARY}"
