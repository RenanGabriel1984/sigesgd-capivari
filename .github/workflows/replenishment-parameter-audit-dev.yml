name: Replenishment parameter audit read-only DEV
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: replenishment-readonly-first-herring
  cancel-in-progress: false
jobs:
  audit:
    if: github.head_ref == 'codex/replenishment-parameterization-readonly-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Tests and production build
        run: bun run test && bun run build
      - name: Guard DEV
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          test -n "${CONVEX_DEPLOY_KEY:-}"
          test "${CONVEX_DEPLOY_KEY%%|*}" = "dev:first-herring-264"
          test -z "${CONVEX_DEPLOYMENT:-}"
      - name: Deploy DEV functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: bunx convex dev --once --tail-logs disable
      - name: Audit parameters without writes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: node scripts/convex-dev-replenishment-parameter-audit.mjs
