name: Diagnóstico read-only do estoque — first-herring-264

on:
  push:
    branches:
      - codex/stock-readonly-diagnostic-first-herring
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: stock-readonly-diagnostic-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/stock-readonly-diagnostic-first-herring'
    name: Publicar código em DEV e consultar estoque sem escrita
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_DEPLOYMENT: first-herring-264
      TARGET_HOST: first-herring-264.convex.cloud
      FORBIDDEN_HOSTS: "savory-sockeye-292.convex.cloud tame-alligator-797.convex.cloud first-dinosaur-625.convex.cloud first-starling-943.convex.cloud brilliant-bullfrog-982.convex.cloud"
    steps:
      - name: Checkout da branch de diagnóstico
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Testes, TypeScript e build antes de qualquer publicação
        run: |
          set -euo pipefail
          bun run test
          bun run build

      - name: Validar chave exclusiva do ambiente de desenvolvimento
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente."
            exit 1
          fi
          prefix="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "${prefix}" != "dev:${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A chave não corresponde a dev:first-herring-264."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida; publicação bloqueada."
            exit 1
          fi
          echo "Destino confirmado: dev:first-herring-264."

      - name: Publicar somente funções e schema em first-herring-264
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-publish.log"
          bunx convex dev --once --tail-logs disable 2>&1 | tee "${log}"
          grep -qF "https://${TARGET_HOST}" "${log}" || {
            echo "::error::A publicação não confirmou o host first-herring-264."
            exit 1
          }
          for host in ${FORBIDDEN_HOSTS}; do
            if grep -qF "${host}" "${log}"; then
              echo "::error::Destino protegido detectado no log: ${host}"
              exit 1
            fi
          done

      - name: Executar query interna estritamente read-only
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          bunx convex run stockSetup:lotLocationMigrationReadinessInternal > "${RUNNER_TEMP}/stock-readiness.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = process.env.RUNNER_TEMP + "/stock-readiness.json";
          const raw = readFileSync(path, "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("A consulta não retornou JSON válido.");
          const result = JSON.parse(raw.slice(start, end + 1));
          if (result.readOnly !== true || result.migrationApplied !== false ||
              result.report?.readOnly !== true || result.report?.migrationApplied !== false ||
              result.plan?.safeToApply !== false) {
            throw new Error("A consulta não confirmou os marcadores de somente leitura; relatório descartado.");
          }
          const products = result.report.products ?? [];
          const counts = { mapped: 0, candidate: 0, divergent: 0, ambiguous: 0, unmapped: 0 };
          let positiveLots = 0;
          for (const product of products) {
            for (const lot of product.lots ?? []) {
              if (lot.quantityAvailable > 0) positiveLots++;
              if (Object.hasOwn(counts, lot.status)) counts[lot.status]++;
            }
          }
          const locations = result.report.locations ?? [];
          const locationTotals = new Map(locations.map((location) => [location.locationId, {
            name: location.name, physical: 0, mapped: 0, candidate: 0, difference: 0
          }]));
          for (const product of products) {
            for (const row of product.localComparison ?? []) {
              const current = locationTotals.get(row.locationId) ?? {
                name: row.locationId, physical: 0, mapped: 0, candidate: 0, difference: 0
              };
              current.physical += row.physicalQuantity;
              current.mapped += row.mappedLotQuantity;
              current.candidate += row.candidateLotQuantity;
              current.difference += row.physicalQuantity - row.mappedLotQuantity - row.candidateLotQuantity;
              locationTotals.set(row.locationId, current);
            }
          }
          const totals = products.reduce((acc, product) => {
            acc.globalPhysical += product.globalPhysical ?? 0;
            acc.localPhysical += product.localPhysicalTotal ?? 0;
            acc.lotAvailable += product.lotsAvailableTotal ?? 0;
            acc.reserved += product.globalReserved ?? 0;
            return acc;
          }, { globalPhysical: 0, localPhysical: 0, lotAvailable: 0, reserved: 0 });
          const cooler = products.find((product) => product.productName === "Cooler para processador Intel");
          const coolerLot = cooler?.lots?.find((lot) => lot.lotNumber === "LOT-2026-000001") ?? null;
          const summary = {
            generatedAt: result.generatedAt,
            readOnly: true,
            migrationApplied: false,
            safeToApply: false,
            counts,
            positiveLots,
            products: products.length,
            locations: [...locationTotals.values()],
            totals,
            plan: {
              proposedLots: result.plan?.insertions?.length ?? 0,
              proposedQuantity: result.plan?.totalQuantityToTrace ?? 0,
              alreadyMapped: result.plan?.alreadyMapped ?? 0,
              blockedProducts: (result.plan?.blockedProducts ?? []).map((product) => ({
                name: product.productName, reasons: product.reasons
              }))
            },
            coolerLot
          };
          writeFileSync(process.env.RUNNER_TEMP + "/stock-readiness-summary.json", JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Registrar resumo sem dados identificadores
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/stock-readiness-summary.json", "utf8"));
          const lines = [
            "### Diagnóstico read-only concluído — first-herring-264",
            "",
            "- Data da consulta: " + new Date(report.generatedAt).toISOString(),
            "- Produtos avaliados: **" + report.products + "**",
            "- Lotes positivos: **" + report.positiveLots + "**",
            "- Situação dos lotes: " + Object.entries(report.counts).map(([key, value]) => key + " " + value).join(" · "),
            "- Propostas documentais: **" + report.plan.proposedLots + " lotes / " + report.plan.proposedQuantity + " unidades numéricas**",
            "- Lotes já mapeados: **" + report.plan.alreadyMapped + "**",
            "- Produtos bloqueados para revisão: **" + report.plan.blockedProducts.length + "**",
            "- Totais agregados (unidades numéricas mistas): global **" + report.totals.globalPhysical + "**; armários **" + report.totals.localPhysical + "**; lotes **" + report.totals.lotAvailable + "**; reservas **" + report.totals.reserved + "**",
            "- Migração aplicada: **não**",
            "- Escritas em estoque: **nenhuma**"
          ];
          if (report.coolerLot) {
            lines.push("- Cooler / LOT-2026-000001: saldo **" + report.coolerLot.quantityAvailable +
              "**; classificação **" + report.coolerLot.status + "**");
          }
          lines.push("", "| Local | Físico | Mapeado | Candidato | Diferença |", "|---|---:|---:|---:|---:|");
          for (const row of report.locations) {
            lines.push("| " + row.name + " | " + row.physical + " | " + row.mapped + " | " +
              row.candidate + " | " + row.difference + " |");
          }
          lines.push("", "> Diagnóstico de leitura apenas. A proposta não é executável e não altera saldos.");
          await import("node:fs").then(({ appendFileSync }) =>
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          );
          NODE

      - name: Publicar status verificável do diagnóstico no commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ]; then
            state="success"
            description="Diagnóstico read-only concluído em first-herring-264"
          else
            state="failure"
            description="Diagnóstico read-only falhou; consulte a execução"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="stock-readonly-diagnostic/first-herring-264" \
            -f description="${description}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
