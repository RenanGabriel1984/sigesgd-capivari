name: Auditoria dimensional do estoque — somente leitura

on:
  push:
    branches:
      - codex/historical-stock-location-maintenance
    paths:
      - "scripts/stock-dimensional-integrity-audit.inline.ts"
      - ".github/workflows/stock-dimensional-integrity-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-dimensional-integrity-audit-first-herring
  cancel-in-progress: false

jobs:
  audit:
    name: Conferir saldos, lotes, áreas e armários sem gravar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_MAINTENANCE_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Validar chave e deployment
        shell: bash
        run: |
          set -euo pipefail
          key="$(printf '%s' "${CONVEX_MAINTENANCE_KEY}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ "${key%%|*}" = "dev:first-herring-264" ] || { echo "::error::Deployment inesperado; auditoria cancelada."; exit 1; }
          printf 'CONVEX_DEPLOY_KEY=%s\n' "${key}" >> "${GITHUB_ENV}"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar auditoria estritamente read-only
        shell: bash
        run: |
          set -euo pipefail
          bunx convex run --inline-query "$(cat scripts/stock-dimensional-integrity-audit.inline.ts)" > "${RUNNER_TEMP}/stock-integrity.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const raw = readFileSync(process.env.RUNNER_TEMP + "/stock-integrity.json", "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("A resposta da auditoria não contém JSON válido.");
          const report = JSON.parse(raw.slice(start, end + 1));
          if (report.readOnly !== true || report.deploymentRequested !== "first-herring-264") {
            throw new Error("A auditoria não confirmou o modo read-only e o deployment esperado.");
          }
          console.log(JSON.stringify(report, null, 2));
          const summary = [
            "## Auditoria dimensional do estoque — first-herring-264",
            "",
            "- Modo: somente leitura",
            "- Produtos: " + report.totals.products,
            "- Lotes ativos: " + report.totals.activeLots,
            "- Saldos por lote/local: " + report.totals.lotLocationBalanceRows,
            "",
            "### Divergências encontradas",
            ...Object.entries(report.integrity).map(([key, value]) => "- " + key + ": **" + value + "**"),
            "",
            "Nenhum dado foi criado, alterado ou removido."
          ].join("\n");
          await import("node:fs/promises").then(fs => fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary + "\n"));
          NODE
