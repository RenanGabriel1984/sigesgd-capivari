name: Auditoria somente leitura — localização histórica pós-correção

on:
  push:
    branches:
      - codex/historical-stock-location-maintenance
    paths:
      - ".github/workflows/verify-historical-stock-location-state.yml"

permissions:
  contents: read

concurrency:
  group: verify-historical-stock-location-state
  cancel-in-progress: false

jobs:
  verify:
    name: Conferir estado atual sem gravações — first-herring-264
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_MAINTENANCE_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar destino e chave
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "${CONVEX_MAINTENANCE_KEY}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${normalized%%|*}" != "dev:first-herring-264" ]; then
            echo "::error::Chave não corresponde ao deployment de desenvolvimento esperado."
            exit 1
          fi
          printf 'CONVEX_DEPLOY_KEY=%s\n' "${normalized}" >> "${GITHUB_ENV}"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Executar auditoria read-only
        shell: bash
        run: |
          set -euo pipefail
          query_source="$(cat scripts/stock-movement-traceability-audit.inline.ts)"
          bunx convex run --inline-query "${query_source}" > "${RUNNER_TEMP}/traceability.json"

          log_query='const rows = await ctx.db.query("auditLogs").withIndex("by_entity", q => q.eq("entity", "stockMovement")).collect(); const matches = rows.filter(row => { try { return JSON.parse(row.details ?? "{}").operation === "historical_location_backfill"; } catch { return false; } }); return { count: matches.length, logs: matches.map(row => ({ auditLogId: String(row._id), movementId: String(row.entityId), details: row.details ?? null, timestamp: row.timestamp ?? null })).sort((a,b) => a.movementId.localeCompare(b.movementId)) };'
          bunx convex run --inline-query "${log_query}" > "${RUNNER_TEMP}/backfill-logs.json"

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          function read(path) {
            const raw = readFileSync(path, "utf8");
            const start = raw.indexOf("{");
            const end = raw.lastIndexOf("}");
            if (start < 0 || end <= start) throw new Error("JSON ausente: " + path);
            return JSON.parse(raw.slice(start, end + 1));
          }
          const audit = read(process.env.RUNNER_TEMP + "/traceability.json");
          const logs = read(process.env.RUNNER_TEMP + "/backfill-logs.json");
          const remaining = audit.missingLocationMovements ?? [];
          const summary = {
            deployment: "dev:first-herring-264",
            readOnly: audit.readOnly === true,
            totals: audit.totals,
            missingLocationByType: audit.missingLocationByType,
            backfillAuditLogCount: logs.count,
            backfillAuditLogMovementIds: (logs.logs ?? []).map(x => x.movementId).sort(),
            remainingWithoutLocation: remaining.map(m => ({
              movementId: m.movementId,
              type: m.type,
              quantity: m.quantity,
              timestamp: m.timestamp,
              productName: m.productName,
              entryId: m.entryId,
              entryNumber: m.entryNumber,
              lotReference: m.lotReference,
              lotNumber: m.lotNumber,
              resolvedLotId: m.resolvedLotId,
              entryItemLocationEvidence: m.entryItemLocationEvidence,
              allocationLocationEvidence: m.allocationLocationEvidence,
              currentLotLocationSnapshot: m.currentLotLocationSnapshot
            }))
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!summary.readOnly) throw new Error("Auditoria não confirmou readOnly=true");
          NODE
