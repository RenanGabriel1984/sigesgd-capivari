name: Operação única — classificar 36 registros TI Geral em first-herring-264

on:
  push:
    branches:
      - codex/stabilizacao-seguranca
    paths:
      - "ops/one-time/execute-ti-geral-classification-20261116.trigger"

permissions:
  contents: read

concurrency:
  group: sigesgd-ti-geral-classification-first-herring
  cancel-in-progress: false

jobs:
  classify:
    if: github.event.head_commit.message == 'ops: execute one-time TI Geral classification in first-herring-264'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALVO_HOST: first-herring-264.convex.cloud
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}

    steps:
      - name: Checkout da branch autorizada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/stabilizacao-seguranca
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar chave do único deployment autorizado
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente. Nenhuma operação executada."
            exit 1
          fi
          case "${CONVEX_DEPLOY_KEY}" in
            dev:first-herring-264\|*) ;;
            *)
              echo "::error::A chave não pertence a dev:first-herring-264. Nenhuma operação executada."
              exit 1
              ;;
          esac
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT poderia sobrepor o destino. Nenhuma operação executada."
            exit 1
          fi
          echo "Chave validada exclusivamente para dev:first-herring-264."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Executar somente a classificação autorizada dos 36 registros
        run: |
          set -euo pipefail
          result="$(bunx convex run stockSetup:applyLegacyGeneralAreaClassification '{"confirmation":"CONFIRMAR_CLASSIFICACAO_36_SALDOS_TI_GERAL_FIRST_HERRING"}' 2>&1)"
          printf '%s\n' "$result"
          if ! grep -Eq '"applied"[[:space:]]*:[[:space:]]*true|"idempotentNoOp"[[:space:]]*:[[:space:]]*true' <<< "$result"; then
            echo "::error::A função não confirmou aplicação ou no-op idempotente."
            exit 1
          fi
          if ! grep -Eq '"totalQuantityClassified"[[:space:]]*:[[:space:]]*1919' <<< "$result"; then
            echo "::error::O retorno não confirmou as 1.919 unidades previstas."
            exit 1
          fi
          if ! grep -Eq '"updatedRows"[[:space:]]*:[[:space:]]*36|"updatedLots"[[:space:]]*:[[:space:]]*36' <<< "$result" && ! grep -q '"idempotentNoOp"[[:space:]]*:[[:space:]]*true' <<< "$result"; then
            echo "::error::A função não confirmou os 36 registros previstos."
            exit 1
          fi
          echo "Classificação documental de TI Geral executada (ou já aplicada anteriormente)."

      - name: Repetir auditoria de integridade somente leitura
        run: |
          set -euo pipefail
          audit="$(bunx convex run stockSetup:lotLocationBalanceIntegrity '{}')"
          printf '%s\n' "$audit"
          if ! grep -Eq '"areaClassificationBlocked"[[:space:]]*:[[:space:]]*0' <<< "$audit"; then
            echo "::error::A auditoria não confirmou zero registros bloqueados em classificação de área."
            exit 1
          fi
          if ! grep -Eq '"lotsMissingLocationMetadata"[[:space:]]*:[[:space:]]*61' <<< "$audit"; then
            echo "::error::A contagem dos 61 lotes sem metadata de localização mudou; revisar antes de qualquer outra ação."
            exit 1
          fi
          echo "Auditoria pós-operação confirmada. Nenhuma operação de localização foi executada." >> "$GITHUB_STEP_SUMMARY"
