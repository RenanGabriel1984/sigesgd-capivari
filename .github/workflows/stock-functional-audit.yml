name: Auditoria funcional integrada — estoque e água — first-herring-264

on:
  push:
    branches:
      - codex/historical-stock-location-maintenance
    paths:
      - "scripts/stock-functional-audit.inline.ts"
      - ".github/workflows/stock-functional-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-functional-audit-first-herring
  cancel-in-progress: false

jobs:
  audit:
    name: Auditoria funcional estritamente read-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_MAINTENANCE_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Validar chave exclusivamente para first-herring-264
        shell: bash
        run: |
          set -euo pipefail
          key="$(printf '%s' "${CONVEX_MAINTENANCE_KEY}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ "${key%%|*}" = "dev:first-herring-264" ] || { echo "::error::Deployment inesperado; auditoria cancelada."; exit 1; }
          printf 'CONVEX_DEPLOY_KEY=%s\n' "${key}" >> "${GITHUB_ENV}"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar consulta inline read-only
        shell: bash
        run: |
          set -euo pipefail
          bunx convex run --inline-query "$(cat scripts/stock-functional-audit.inline.ts)" > "${RUNNER_TEMP}/functional-audit.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const raw=readFileSync(process.env.RUNNER_TEMP+"/functional-audit.json","utf8");
          const start=raw.indexOf("{"), end=raw.lastIndexOf("}");
          if(start<0||end<=start) throw new Error("Relatório JSON inválido.");
          const report=JSON.parse(raw.slice(start,end+1));
          if(report.readOnly!==true||report.deploymentRequested!=="first-herring-264"||
             report.safeguards.writes!==0||report.safeguards.mutationsCalled!==0)
            throw new Error("Salvaguardas read-only não confirmadas.");
          console.log(JSON.stringify(report,null,2));
          const lines=[
            "## Auditoria funcional — first-herring-264",
            "",
            "- Somente leitura: **confirmado**",
            "- Registros inspecionados: **"+report.totalRows+"**",
            "- Anomalias por grupo: "+JSON.stringify(report.anomalyCounts),
            "- Galões cheios: **"+report.water.fullGallons+"**",
            "- Galões vazios: **"+report.water.emptyGallons+"**",
            "- Compras (centavos): **"+report.water.purchasedCents+"**",
            "- Rateado (centavos): **"+report.water.allocatedCents+"**",
            "- Pago (centavos): **"+report.water.paidCents+"**",
            "- Em aberto (centavos): **"+report.water.outstandingCents+"**",
            "",
            "Nenhuma mutation foi chamada; nenhuma gravação foi realizada."
          ];
          await import("node:fs/promises").then(fs=>fs.appendFile(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n"));
          NODE
          cp "${RUNNER_TEMP}/functional-audit.json" "${RUNNER_TEMP}/functional-audit-report.json"
      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-functional-audit-first-herring
          path: ${{ runner.temp }}/functional-audit-report.json
          if-no-files-found: error
          retention-days: 14
