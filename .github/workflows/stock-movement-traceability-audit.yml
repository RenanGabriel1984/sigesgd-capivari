name: Auditoria somente leitura — first-herring-264

on:
  push:
    branches:
      - codex/stock-ledger-integration
    paths:
      - scripts/stock-movement-traceability-audit.inline.ts
      - .github/workflows/stock-movement-traceability-audit.yml

permissions:
  contents: read

concurrency:
  group: stock-movement-traceability-audit-first-herring
  cancel-in-progress: false

jobs:
  audit:
    name: Executar consulta somente leitura no first-herring-264
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_DEPLOYMENT: first-herring-264
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Validar alvo e garantir execução sem publicação
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/codex/stock-ledger-integration" ]; then
            echo "::error::Branch inesperada. Auditoria cancelada."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT inesperada. Auditoria cancelada."
            exit 1
          fi
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente."
            exit 1
          fi
          prefix="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "${prefix}" != "dev:${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A deploy key não corresponde a dev:${TARGET_DEPLOYMENT}. Nenhuma chamada foi feita."
            exit 1
          fi
          if grep -nE 'ctx\.db\.(insert|patch|replace|delete)[[:space:]]*\(' scripts/stock-movement-traceability-audit.inline.ts; then
            echo "::error::Operação de escrita encontrada no script. Auditoria cancelada."
            exit 1
          fi
          echo "Destino validado: dev:${TARGET_DEPLOYMENT}"
          echo "Modo: convex run --inline-query (consulta isolada somente leitura)"
          echo "Publicação de backend: não será executada."
          echo "Migrações/mutations/importações: não serão executadas."

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Executar auditoria somente leitura
        shell: bash
        run: |
          set -euo pipefail
          query_source="$(cat scripts/stock-movement-traceability-audit.inline.ts)"
          bunx convex --version
          bunx convex run --deployment "${TARGET_DEPLOYMENT}" --inline-query "${query_source}" 2>&1 | tee "${RUNNER_TEMP}/stock-movement-audit.json"
          {
            echo "### Auditoria somente leitura concluída"
            echo ""
            echo "- Deployment: `dev:${TARGET_DEPLOYMENT}`"
            echo "- Método: `convex run --inline-query`"
            echo "- Publicação de backend: não executada"
            echo "- Alterações nos dados: nenhuma"
            echo ""
            echo "O resultado completo está no log desta etapa."
          } >> "${GITHUB_STEP_SUMMARY}"
