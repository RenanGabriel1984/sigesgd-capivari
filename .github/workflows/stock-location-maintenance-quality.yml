name: Validação — correção histórica de localização

on:
  push:
    branches:
      - codex/historical-stock-location-maintenance
    paths:
      - "src/convex/stockMovementLocationMaintenance.ts"
      - "src/convex/historicalTestMovementMaintenance.ts"
      - "src/convex/schema.ts"
      - "src/__tests__/stock-movement-location-maintenance.test.ts"
      - ".github/workflows/stock-location-maintenance-quality.yml"
  pull_request:
    branches:
      - codex/stabilizacao-seguranca

permissions:
  contents: read

concurrency:
  group: historical-location-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, TypeScript e build (sem deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar testes Vitest
        run: bunx vitest run
      - name: TypeScript e build
        run: bun run build
