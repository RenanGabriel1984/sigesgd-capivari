name: Verificações de qualidade — RBAC e Patrimônio

on:
  push:
    branches:
      - codex/rbac-audit-hardening
      - codex/gomaq-ledger-area-integration
      - codex/stock-dimension-report-integrity
  pull_request:
    branches:
      - main
      - codex/rbac-audit-hardening

permissions:
  contents: read

concurrency:
  group: quality-rbac-patrimony-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes e compilação (sem deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Instalar dependências com lockfile congelado
        run: bun install --frozen-lockfile

      - name: Executar testes
        run: bun run test

      - name: Verificar TypeScript e build de produção
        run: bun run build
