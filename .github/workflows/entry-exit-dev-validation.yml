name: Entradas e saídas reais — Convex DEV
on:
  push:
    branches: [codex/entry-exit-dev-runtime-validation]
  pull_request:
    branches: [codex/water-mineral-integrated]
permissions:
  contents: read
concurrency:
  group: entry-exit-dev-first-herring
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with: {bun-version: "1.3.14"}
      - run: bun install --frozen-lockfile
      - name: Quality gates
        run: bun run test && bun run build
  dev-transaction:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/entry-exit-dev-runtime-validation'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with: {bun-version: "1.3.14"}
      - run: bun install --frozen-lockfile
      - name: Guard target DEV only
        env: {CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}}
        run: |
          set -euo pipefail
          test "${CONVEX_DEPLOY_KEY%%|*}" = "dev:first-herring-264"
          test -z "${CONVEX_DEPLOYMENT:-}"
      - name: Deploy Convex DEV
        env: {CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}}
        run: bunx convex dev --once --tail-logs disable
      - name: Exercise actual mutations and verify cleanup
        env: {CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}}
        run: node scripts/convex-dev-entry-exit-validation.mjs
