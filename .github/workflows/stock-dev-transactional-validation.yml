name: Validação transacional controlada — Convex DEV

on:
  pull_request:
    branches:
      - codex/returns-transfers-ledger-integration

permissions:
  contents: read

concurrency:
  group: stock-dev-transactional-first-herring
  cancel-in-progress: false

jobs:
  transactional-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/dev-transactional-validation'
    name: Exercitar devoluções e transferências em fixture isolada
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_DEPLOYMENT: first-herring-264
      TARGET_HOST: first-herring-264.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Testes, TypeScript e build antes da publicação
        run: |
          set -euo pipefail
          bun run test
          bun run build

      - name: Validar chave exclusiva de DEV
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY_FIRST_HERRING ausente."
            exit 1
          fi
          prefix="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "${prefix}" != "dev:${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A chave não corresponde a dev:first-herring-264."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida; execução bloqueada."
            exit 1
          fi
          echo "Destino exclusivo confirmado: dev:first-herring-264."

      - name: Publicar funções e schema exclusivamente em DEV
        id: deploy
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/convex-dev-deploy.log"
          bunx convex dev --once --tail-logs disable 2>&1 | tee "${log}"
          grep -qF "https://${TARGET_HOST}" "${log}" || {
            echo "::error::O CLI não confirmou o host DEV esperado."
            exit 1
          }
          grep -qF "Preparing Convex functions" "${log}" || {
            echo "::error::O CLI não confirmou a preparação das funções."
            exit 1
          }
          if grep -Eqi "savory-sockeye-292|tame-alligator-797|first-dinosaur-625|first-starling-943|brilliant-bullfrog-982" "${log}"; then
            echo "::error::Um destino protegido foi detectado no log."
            exit 1
          fi

      - name: Executar mutations reais com fixture temporária e identidade autorizada
        id: transaction_tests
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
        run: node scripts/convex-dev-stock-transactions.mjs

      - name: Limpeza de segurança — idempotente
        if: always() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_FIRST_HERRING }}
          RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bunx convex run --deployment "${TARGET_DEPLOYMENT}" stockDevTransactionTests:cleanup "{\"runId\":\"${RUN_ID}\"}"
          bunx convex run --deployment "${TARGET_DEPLOYMENT}" --inline-query \
            'const name = "__SIGESGD_DEV_TXN__'"${RUN_ID}"'__PRODUCT"; const product = await ctx.db.query("products").withIndex("by_name", (q) => q.eq("name", name)).first(); if (product) throw new Error("Fixture de teste ainda existe após a limpeza."); return { fixtureRemaining: false };'

