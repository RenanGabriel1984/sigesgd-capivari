name: Auditoria operacional do estoque — somente leitura

on:
  push:
    branches:
      - codex/stock-ledger-integration
    paths:
      - ".github/workflows/stock-operational-readonly-audit.yml"
      - "scripts/stock-operational-readonly-audit.inline.ts"

permissions:
  contents: read

concurrency:
  group: stock-operational-readonly-audit-first-herring
  cancel-in-progress: false

jobs:
  read-only-audit:
    name: Consultar estoque operacional em first-herring-264 (sem escrita)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_DEPLOYMENT: first-herring-264
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/stock-ledger-integration
          persist-credentials: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Validar chave exclusivamente para dev:first-herring-264
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::Secret CONVEX_MAINTENANCE_KEY_FIRST_HERRING ausente. Nenhuma consulta foi executada."
            exit 1
          fi
          prefix="${CONVEX_DEPLOY_KEY%%|*}"
          if [ "${prefix}" != "dev:${TARGET_DEPLOYMENT}" ]; then
            echo "::error::A chave não corresponde a dev:${TARGET_DEPLOYMENT}. Nenhuma consulta foi executada."
            exit 1
          fi
          if [ -n "${CONVEX_DEPLOYMENT:-}" ]; then
            echo "::error::CONVEX_DEPLOYMENT está definida e poderia mudar o destino. Nenhuma consulta foi executada."
            exit 1
          fi
          echo "Destino validado por prefixo: dev:${TARGET_DEPLOYMENT}. A chave não será exibida."

      - name: Instalar dependências pelo lockfile
        run: bun install --frozen-lockfile

      - name: Executar somente consulta inline read-only
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_MAINTENANCE_KEY_FIRST_HERRING }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/stock-operational-readonly-audit.json"
          query="scripts/stock-operational-readonly-audit.inline.ts"
          if grep -Eq 'ctx\.db\.(insert|patch|replace|delete)[[:space:]]*\(|runMutation|internalMutation' "${query}"; then
            echo "::error::A consulta contém padrão de escrita proibido. Execução cancelada."
            exit 1
          fi
          # O deploy key validado define o destino. Não usar --push, --prod,
          # deploy, mutation ou action: somente --inline-query.
          bunx convex run --inline-query "$(cat "${query}")" > "${report}"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const path = process.env.RUNNER_TEMP + "/stock-operational-readonly-audit.json";
          const raw = readFileSync(path, "utf8");
          const start = raw.indexOf("{");
          const end = raw.lastIndexOf("}");
          if (start < 0 || end <= start) throw new Error("A consulta não retornou JSON válido.");
          const report = JSON.parse(raw.slice(start, end + 1));
          if (report.readOnly !== true || report.deploymentRequested !== "first-herring-264") {
            throw new Error("Destino/contrato read-only não confirmados na resposta.");
          }
          const flagged = report.products.filter((product) => product.flags.length > 0);
          const lines = [
            "### Auditoria operacional do estoque — somente leitura",
            "",
            "- Deployment confirmado pela chave: `dev:first-herring-264`",
            "- Consulta executada: inline read-only",
            "- Escritas no backend: **zero**",
            "- Produtos cadastrados: " + report.totals.products,
            "- Produtos com linhas de saldo global: " + report.totals.globalStockRows,
            "- Saldo físico global: " + report.totals.globalPhysical,
            "- Saldo físico por armário: " + report.totals.stockByLocationPhysical,
            "- Diferença global × armários: " + (report.totals.globalPhysical - report.totals.stockByLocationPhysical),
            "- Saldo disponível em lotes: " + report.totals.lotAvailable,
            "- Reservado global: " + report.totals.globalReserved,
            "- Solicitações aprovadas: " + report.totals.approvedRequests,
            "- Movimentações: " + report.totals.movements,
            "- Produtos sinalizados para revisão: " + flagged.length,
            "- lotLocationBalances disponível: " + report.schemaAvailability.lotLocationBalances,
            "- stockMovementLotAllocations disponível: " + report.schemaAvailability.stockMovementLotAllocations,
            "",
            "#### Produtos sinalizados",
            "",
          ];
          if (flagged.length === 0) lines.push("Nenhum produto foi sinalizado pelas regras desta consulta.");
          else {
            lines.push("| Produto | Global | Armários | Reservado | Esperado | Divergências |");
            lines.push("|---|---:|---:|---:|---:|---|");
            for (const row of flagged) {
              lines.push("| " + row.product + " | " + row.globalPhysical + " | " + row.localPhysical +
                " | " + row.globalReserved + " | " + row.expectedReservedFromApprovedRequests +
                " | " + row.flags.join(", ") + " |");
            }
          }
          lines.push("", "O JSON integral ficou disponível no log desta execução.", "");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          console.log("STOCK_OPERATIONAL_READONLY_AUDIT_BEGIN");
          console.log(JSON.stringify(report));
          console.log("STOCK_OPERATIONAL_READONLY_AUDIT_END");
          NODE

      - name: Publicar resultado como artefato de auditoria (sem alterar o backend)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-operational-readonly-audit-first-herring
          path: ${{ runner.temp }}/stock-operational-readonly-audit.json
          if-no-files-found: error
          retention-days: 7
